name: Refresh forecast
on:
  schedule:
    # Tried hourly because GitHub skips many scheduled runs; refresh.py skips itself when data is under ~2.4 h old.
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Fetch forecasts
        env:
          SKYWINDOW_FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python3 refresh.py forecast.json
      - name: Commit new data
        run: |
          git config user.name "sky-window-bot"
          git config user.email "actions@users.noreply.github.com"
          git add forecast.json
          git diff --cached --quiet && exit 0
          git commit -m "Forecast refresh"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main || true
            git push && exit 0
            echo "push failed (attempt $i), retrying"; sleep $((i * 20))
          done
          exit 1
