name: Refresh forecast
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch forecasts
        run: python3 refresh.py forecast.json
      - name: Commit new data
        run: |
          git config user.name "sky-window-bot"
          git config user.email "actions@users.noreply.github.com"
          git add forecast.json
          git diff --cached --quiet || git commit -m "Forecast refresh"
          git push
